# gmap API 反向代理配置。
upstream gmap_backend_{BACKEND_PORT_PY} {
    server 127.0.0.1:{BACKEND_PORT_PY};
    keepalive 64;
}

server
{
    listen 80;
    server_name {NGINX_SERVER_NAME};
    large_client_header_buffers 4 16k;

    # Website 依赖读取严格鉴权的 401；没有 always 时 nginx 只给成功响应加 CORS 头，
    # 浏览器会把真实 401 降级成不可区分的网络错误，导致过期登录态无法清理。
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, X-Device-Id, X-Client-Product, Accept-Language, Accept, Mcp-Protocol-Version, Mcp-Session-Id, Mcp-Method, Mcp-Name' always;
    add_header Access-Control-Expose-Headers "Mcp-Protocol-Version, Mcp-Session-Id" always;
    add_header Access-Control-Max-Age 1728000 always;

    if ($request_method = OPTIONS) { return 204; }

    # 隐藏后端返回的 CORS 头，避免重复
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /mcp/ {
      proxy_pass http://gmap_backend_{BACKEND_PORT_PY};
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 195s;
    }
    location = /mcp { return 404; }
    location = /.well-known/oauth-authorization-server {
      proxy_pass http://gmap_backend_{BACKEND_PORT_PY};
    }
    location = /.well-known/oauth-protected-resource/mcp/ {
      proxy_pass http://gmap_backend_{BACKEND_PORT_PY};
    }

    # 覆盖完整媒体采集预算并留出响应余量。
    location ~ ^/api/external/maps/(reviews|photos)$ {
      proxy_pass http://gmap_backend_{BACKEND_PORT_PY};
      proxy_read_timeout 195s;
    }

    # 转发 API 到后端服务
    location / {
      proxy_pass http://gmap_backend_{BACKEND_PORT_PY};
    }
    location ~ /\.
    {
        deny all;
    }
}
