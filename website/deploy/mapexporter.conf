# 生产参数由 production.conf 渲染。
server {
    listen {DEPLOY_HTTP_PORT};
{TLS_CONFIG}
    server_name {DEPLOY_DOMAIN};

    root {DEPLOY_SERVER_ROOT}/current;
    index index.html;

    charset utf-8;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # 设备可信校验图标反代到后端写 device_trust（购买/登录链路基座）
    location ~ ^/assets/icons/(?:logo|credits)\.svg$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass {DEPLOY_API_UPSTREAM};
    }
    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ /\. {
        deny all;
    }

    # Astro 以目录格式输出页面。直接检查构建产物中的 index.html，使当前及以后新增的页面
    # 都得到一次 HTTPS canonical 跳转，无需在 Nginx 维护第二份路由表。
    location ~ "^/.*[^/]$" {
        if (-f $request_filename/index.html) {
            return 301 https://$host$uri/$is_args$args;
        }
    }
}
