# MapsGrab 测试站，登录设备校验资源必须穿透到同环境后端。
server {
    listen 80;
    server_name gmap-test.hydrai.cc;

    root /data/mapsgrab-web-test/current;
    index index.html;

    access_log /usr/local/nginx/logs/test-mapsgrab-web.access.log;
    error_log /usr/local/nginx/logs/test-mapsgrab-web.error.log;

    charset utf-8;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    if ($http_user_agent ~* (Googlebot|bingbot|Storebot-Google)) {
        return 403;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/assets/icons/(?:logo|credits)\.svg$ {
        proxy_set_header Host gmap-test-api.hydrai.cc;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:9701;
    }
    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ /\. {
        deny all;
    }

    location ~ "^/.*[^/]$" {
        if (-f $request_filename/index.html) {
            return 301 https://$host$uri/$is_args$args;
        }
    }
}
