# MapsGrab 测试站 Nginx 配置底座（域名占位，正式测试域名后配）。
server {
    listen 80;
    server_name test-mapsgrab-web.example.com;

    root /data/mapsgrab-web-test/current;
    index index.html;

    access_log /usr/local/nginx/logs/test-mapsgrab-web.access.log;
    error_log /usr/local/nginx/logs/test-mapsgrab-web.error.log;

    charset utf-8;

    if ($http_user_agent ~* (Googlebot|bingbot|Storebot-Google)) {
        return 403;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~ ^/assets/icons/(?:logo|credits)\.svg$ {
        proxy_set_header Host test-api-mapsgrab.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:9600;
    }
    location ~* \.(?:css|gif|ico|jpe?g|js|mjs|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location ~ /\. {
        deny all;
    }

    location ~ "^/.*[^/]$" {
        if (-f $request_filename/index.html) {
            return 301 https://$host$uri/$is_args$args;
        }
    }
}
